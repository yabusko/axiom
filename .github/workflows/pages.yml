name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # B8: VITE_DEMO=1 serves recorded real API responses from
      # web/src/demoData.ts -- no backend at all, see api.ts/demoData.ts.
      # vite.config.ts reads the same var to set base: "/axiom/" (this repo's
      # Pages project-site path), so routing and asset URLs resolve correctly
      # under that subpath.
      - run: VITE_DEMO=1 npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
