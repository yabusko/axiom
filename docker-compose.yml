services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: axiom-qdrant
    ports:
      - "6333:6333"   # REST + gRPC entry used by qdrant-client
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Distributed workers (AXIOM_DISTRIBUTED_TASK.md, axiom/workers.py). Only
  # used when AXIOM_EXECUTION=distributed -- the default `local` in-process
  # path (axiom/agents/pipeline.py) needs none of this.
  redis:
    image: redis:7-alpine
    container_name: axiom-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  worker-coordinator:
    build: .
    command: coordinator
    environment: &worker-env
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AXIOM_OS_TRUSTSTORE: ${AXIOM_OS_TRUSTSTORE:-}
    volumes: &worker-volumes
      - ./data:/app/data
    depends_on: [redis]
    restart: unless-stopped

  worker-extraction:
    build: .
    command: extraction
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: [redis]
    restart: unless-stopped
    # scale this one: docker compose up --scale worker-extraction=3

  worker-enrichment:
    build: .
    command: enrichment
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: [redis]
    restart: unless-stopped

  worker-linking:
    build: .
    command: linking
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: [redis]
    restart: unless-stopped

volumes:
  qdrant_storage:
